packages:
  - apps/*
  - packages/*

# Next permite ^0.34.5; evitar conservar ese binario vulnerable junto a Storage.
overrides:
  'next>sharp': 0.35.5

onlyBuiltDependencies:
  - esbuild
  - sharp
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
